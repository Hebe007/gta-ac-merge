; Copy next to GtaAcLink.asi in your GTA V folder.
[link]
; GTA car that represents your AC car (any GTA vehicle model name)
model=sultan
; extra metres to raise (+) or lower (-) the GTA car if the wheels still sit wrong, e.g. 0.05
height_trim=0
; 1 = GTA physics never moves your car (no flips or pushes from GTA-only objects); 0 = GTA physics
; acts between updates (wheels animate, but trees/walls can shove or flip it)
frozen=0
; 1 = flip steering if GTA's wheels turn the opposite way to AC's
steer_invert=0
; GTA wheel angle per AC wheel angle: lower (e.g. 0.5) if GTA's wheels hit full lock long before yours
steer_scale=1
; centre correction, -1..1 (+ = left): e.g. 0.05 if GTA's wheels point slightly right when you're straight
steer_offset=0
; seconds to steer ahead of AC to hide GTA's steering smoothing (0 = off; try 0.03-0.12)
steer_lead=0.06
; 1 = GTA may damage the car; 0 = damage-proof (AC is in charge)
gta_damage=0
; GTA engine sound: an electric car's (near silent) so the engine can run and the dashboard works.
; Any GTA car name works; off = engine off (silent, but dashboard dark)
engine_audio=voltic
; 1 = pass AC's throttle/brake to GTA (rev counter moves, brake lights); 0 = off
pedals=1
; 1 = under the map for over a second, or stuck in the road for 1 s: put the car back on its wheels right there
; (F9 does it by hand)
auto_reset=1
; how hard GTA traffic and pedestrians push your AC car when they hit you: 1 = like GTA, 0.5 = half, 0 = not at all
hit_strength=1
; extra push for the sideways part of a hit (being T-boned): 1 = none, 1.5 = default
hit_sideways=1.5
; 1 = GTA can burst your tyres (spike strips, cops shooting them) and the same tyre blows in AC; 0 = never
tyres_burst=1
; Shared memory name written by the GTA Link app in AC. Only change if tools\linkpeek.py shows another name works.
shm_name=AcTools.CSP.GtaAcLink.State.v1
