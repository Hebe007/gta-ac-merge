# GTA V collision material (materials.dat name) -> Assetto Corsa surface key.
# A name ending in * matches by prefix; exact names win over prefixes. Anything unlisted becomes ROAD
# (with a warning), so bridges, metal and wood decks stay drivable.
[materials]
TARMAC = "ROAD"
"TARMAC_*" = "ROAD"
"CONCRETE*" = "ROAD"
PAVING_SLAB = "ROAD"
COBBLESTONE = "ROAD"
BRICK = "ROAD"
STONE = "ROAD"
BREEZE_BLOCK = "ROAD"
MARBLE = "ROAD"
"SNOW*" = "SNOW"
"ICE*" = "ICE"
RUMBLE_STRIP = "KERB"
"GRASS*" = "GRASS"
BUSHES = "GRASS"
LEAVES = "GRASS"
HAY = "GRASS"
SOIL = "GRASS"
TWIGS = "GRASS"
WOODCHIPS = "GRASS"
"MARSH*" = "GRASS"
"SAND*" = "SAND"
"GRAVEL*" = "GRAVEL"
DIRT_TRACK = "GRAVEL"
"MUD_*" = "GRAVEL"
"CLAY_*" = "GRAVEL"
"ROCK*" = "GRAVEL"

# Building and object materials: rooftops, floors, car-park decks, bridges. Drivable when flat; steep
# triangles become WALL anyway. Listed so they don't warn.
DEFAULT = "ROAD"
"METAL_*" = "ROAD"
"WOOD_*" = "ROAD"
"GLASS_*" = "ROAD"
"CAR_GLASS_*" = "ROAD"
"PLASTER_*" = "ROAD"
"PLASTIC*" = "ROAD"
"CARPET_*" = "ROAD"
"VFX_*" = "ROAD"
"PHYS_*" = "ROAD"
ROOF_FELT = "ROAD"
LINOLEUM = "ROAD"
CERAMIC = "ROAD"
POLYSTYRENE = "ROAD"
TARPAULIN = "ROAD"
CLOTH = "ROAD"
PAPER = "ROAD"
FIBREGLASS = "ROAD"
SLATTED_BLINDS = "ROAD"
# Water surfaces (pools, fountains, canals) are left out: you fall in instead of driving across.
WATER = "NONE"
PUDDLE = "ROAD"
LAMINATE = "ROAD"
ROOF_TILE = "ROAD"
LEATHER = "ROAD"
"EMISSIVE_*" = "ROAD"
# Tree trunks: always solid, never drivable.
TREE_BARK = "WALL"
