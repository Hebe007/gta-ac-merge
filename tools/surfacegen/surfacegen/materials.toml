# GTA V collision material (materials.dat name) -> Assetto Corsa surface key.
# A name ending in * matches by prefix; exact names win over prefixes. Anything unlisted becomes ROAD
# (with a warning), so bridges, metal and wood decks stay drivable.
[materials]
TARMAC = "ROAD"
"TARMAC_*" = "ROAD"
"CONCRETE*" = "ROAD"
PAVING_SLAB = "ROAD"
COBBLESTONE = "ROAD"
BRICK = "ROAD"
STONE = "ROAD"
MARBLE = "ROAD"
"ICE_TARMAC" = "ROAD"
"SNOW_TARMAC" = "ROAD"
RUMBLE_STRIPS = "KERB"
"GRASS*" = "GRASS"
BUSHES = "GRASS"
LEAVES = "GRASS"
HAY = "GRASS"
SOIL = "GRASS"
TWIGS = "GRASS"
WOODCHIPS = "GRASS"
"MARSH*" = "GRASS"
"SAND*" = "SAND"
"GRAVEL*" = "GRAVEL"
DIRT_TRACK = "GRAVEL"
"MUD_*" = "GRAVEL"
"CLAY_*" = "GRAVEL"
"ROCK*" = "GRAVEL"
